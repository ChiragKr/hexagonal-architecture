spring:
  application:
    name: notification

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        '[spring.json.trusted.packages]': "com.pluralkraft.notification.domain.model"
        '[spring.json.value.default.type]': "com.pluralkraft.notification.domain.model.Notification"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        '[spring.json.trusted.packages]': "com.pluralkraft.notification.domain.model"
        '[spring.json.value.default.type]': "com.pluralkraft.notification.domain.model.Notification"

  mongodb:
    host: mongo
    port: 27017
    username: admin
    password: password
    database: notification
    authentication-database: admin

notification:
  web:
    endpoint: http://localhost:8080
  retry:
    # Delay between retry runs (per instance) and initial delay after startup
    interval: PT1M
    initial-delay: PT30S
    # Number of most recent FAILURE deliveries claimed per run
    batch-size: 50
    # Retries before a notification is published to the dead letter topic
    max-retries: 3
    # Claim lease; must exceed the worst-case duration of a batch
    lease: PT5M
    dlq-topic: notification.dlq
    dlq-send-timeout: PT10S
